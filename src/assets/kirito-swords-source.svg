<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="880" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152238"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="blade" x1="280" y1="220" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#B8C7E0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed square (macOS applies its own mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <circle cx="360" cy="420" r="220" fill="#3A7BFF" fill-opacity="0.16"/>
  <circle cx="680" cy="620" r="180" fill="#5CC8FF" fill-opacity="0.10"/>

