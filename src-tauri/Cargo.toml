[package]
name = "kirito"
version = "0.1.0"
description = "A lightweight macOS Wine launcher"
authors = ["kirito contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kirito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", features = ["tray-icon"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
